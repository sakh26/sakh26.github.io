    <script>
      // Gamle lenker til en del av porteføljen, som sarak.dev/#prosjekter, sendes videre dit.
      if (/^#(om|prosjekter|utdannelse|ferdigheter|erfaring|kontakt)$/.test(location.hash)) {
        location.replace('/portefolje/' + location.hash)
      }
    </script>
    <script>
      // Bevegelse er på, med mindre maskinen ber om mindre bevegelse eller valget er lagret.
      var bevegelse = !matchMedia('(prefers-reduced-motion: reduce)').matches
      try {
        var lagret = localStorage.getItem('bevegelse')
        if (lagret) bevegelse = lagret === 'på'
      } catch (e) {}
      if (bevegelse) document.documentElement.classList.add('moving')
    </script>
